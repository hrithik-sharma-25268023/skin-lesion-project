name: skin-lesion-project

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10.8

  # Core ML
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # Data
  - numpy
  - pandas
  - scikit-learn

  # Images
  - pillow
  - opencv

  # Visualization
  - matplotlib
  - plotly
  - seaborn

  # Utilities
  - tqdm
  - pyyaml
  - ipykernel

  # Required for pytest on Python 3.10
  - tomli

  - pip
  - pip:
      - timm
      - boto3
      - setuptools
      - haversine
      - dvc
      - dvc[s3]
      - streamlit
      - pdf2image
      - "mlflow>=3.1"
      - "pytest<9"
      - albumentations
      - transformers
      - dvclive